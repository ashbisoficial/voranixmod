plugins {
    id 'java'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = maven_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--username', 'Dev'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    // JEI
    maven { url = 'https://maven.blamejared.com' }
    // EMI
    maven { url = 'https://maven.terraformersmc.com/releases' }
    // Jade (published on Modrinth's maven; no dedicated api jar, only the full mod jar)
    maven { url = 'https://api.modrinth.com/maven' }
    // The One Probe
    maven { url = 'https://maven.k-4u.nl' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-47.2.0"

    // All five are compile-time only: none are bundled, none are required at runtime.
    // ModCompat gates every call into these APIs behind ModList.get().isLoaded(...), so the
    // mod runs identically with any subset of them present, absent, or all installed at once.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:15.20.0.133"
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:15.20.0.133"
    compileOnly "dev.emi:emi-forge:1.1.24+${minecraft_version}:api"
    compileOnly "maven.modrinth:jade:11.13.2+forge"
    compileOnly "mcjty.theoneprobe:theoneprobe:${minecraft_version}-10.0.1-3:api"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    manifest {
        attributes([
                'Specification-Title'    : mod_name,
                'Specification-Vendor'   : 'Voranix',
                'Implementation-Title'   : project.name,
                'Implementation-Version' : project.version,
                'Implementation-Vendor'  : 'Voranix'
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
